<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F1F1EC"/>
  
  <!-- Viewfinder Frame -->
  <g transform="translate(80, 60)">
    <rect width="640" height="480" rx="8" fill="#121512" stroke="#2B302B" stroke-width="2"/>
    
    <!-- Viewfinder Corners -->
    <path d="M 40 70 L 40 40 L 70 40" stroke="#FF5B1F" stroke-width="3" fill="none"/>
    <path d="M 600 70 L 600 40 L 570 40" stroke="#FF5B1F" stroke-width="3" fill="none"/>
    <path d="M 40 410 L 40 440 L 70 440" stroke="#FF5B1F" stroke-width="3" fill="none"/>
    <path d="M 600 410 L 600 440 L 570 440" stroke="#FF5B1F" stroke-width="3" fill="none"/>

    <!-- Central Focus Reticle -->
    <circle cx="320" cy="240" r="38" stroke="#F8F8F4" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <circle cx="320" cy="240" r="4" fill="#FF5B1F"/>

    <!-- Recording Indicator -->
    <circle cx="60" cy="70" r="7" fill="#FF5B1F"/>
    <text x="78" y="75" font-family="monospace" font-size="14" font-weight="bold" fill="#F8F8F4" letter-spacing="1">REC 4K // 60FPS ON-SITE</text>
    
    <!-- Audio Waveform / Analytics Bars -->
    <g transform="translate(60, 380)">
      <rect x="0" y="20" width="6" height="30" fill="#FF5B1F"/>
      <rect x="12" y="10" width="6" height="40" fill="#FF5B1F"/>
      <rect x="24" y="0" width="6" height="50" fill="#FF5B1F"/>
      <rect x="36" y="15" width="6" height="35" fill="#FF5B1F"/>
      <rect x="48" y="5" width="6" height="45" fill="#FF5B1F"/>
      <rect x="60" y="22" width="6" height="28" fill="#FF5B1F"/>
      <text x="80" y="45" font-family="monospace" font-size="12" fill="#C9CBC4">+320% ENGAGEMENT MO/MO</text>
    </g>

    <!-- Content Schedule Card Overlay -->
    <g transform="translate(400, 260)">
      <rect width="200" height="160" rx="6" fill="#1E231E" stroke="#FF5B1F" stroke-width="1.5"/>
      <text x="16" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F8F8F4">SCHEDULED CONTENT</text>
      <line x1="16" y1="40" x2="184" y2="40" stroke="#3C413B" stroke-width="1"/>
      <text x="16" y="65" font-family="sans-serif" font-size="12" fill="#C9CBC4">✓ Job walkthrough reel</text>
      <text x="16" y="90" font-family="sans-serif" font-size="12" fill="#C9CBC4">✓ Customer testimonial</text>
      <text x="16" y="115" font-family="sans-serif" font-size="12" fill="#C9CBC4">✓ Team behind-the-scenes</text>
      <rect x="16" y="130" width="80" height="18" rx="2" fill="#FF5B1F"/>
      <text x="56" y="143" font-family="monospace" font-size="9" font-weight="bold" fill="#121512" text-anchor="middle">PUBLISHED</text>
    </g>
  </g>
</svg>