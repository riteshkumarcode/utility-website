<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#121512"/>
  
  <g transform="translate(80, 60)">
    <!-- Main Card -->
    <rect width="640" height="480" rx="8" fill="#1E231E" stroke="#3C413B" stroke-width="2"/>
    
    <!-- Top Header -->
    <rect x="0" y="0" width="640" height="60" fill="#121512" rx="8 8 0 0"/>
    <circle cx="36" cy="30" r="8" fill="#FF5B1F"/>
    <text x="56" y="36" font-family="monospace" font-size="14" font-weight="bold" fill="#F8F8F4" letter-spacing="1">PAID ADS CAMPAIGN ROI MONITOR</text>
    
    <!-- 3 Metric Cards -->
    <g transform="translate(30, 90)">
      <!-- Card 1 -->
      <rect width="180" height="110" rx="6" fill="#121512" stroke="#2B302B" stroke-width="1.5"/>
      <text x="18" y="32" font-family="monospace" font-size="11" fill="#8B8F86">AD SPEND</text>
      <text x="18" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#F8F8F4">£1,250</text>
      <text x="18" y="92" font-family="sans-serif" font-size="11" fill="#8B8F86">Exact budget cap</text>

      <!-- Card 2 -->
      <g transform="translate(198, 0)">
        <rect width="180" height="110" rx="6" fill="#121512" stroke="#FF5B1F" stroke-width="2"/>
        <text x="18" y="32" font-family="monospace" font-size="11" fill="#FF5B1F">QUALIFIED LEADS</text>
        <text x="18" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#FF5B1F">46</text>
        <text x="18" y="92" font-family="sans-serif" font-size="11" fill="#C9CBC4">£27.17 cost per lead</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(396, 0)">
        <rect width="180" height="110" rx="6" fill="#121512" stroke="#2B302B" stroke-width="1.5"/>
        <text x="18" y="32" font-family="monospace" font-size="11" fill="#8B8F86">RETURN ON SPEND</text>
        <text x="18" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#F8F8F4">6.4x</text>
        <text x="18" y="92" font-family="sans-serif" font-size="11" fill="#8B8F86">Direct quoted revenue</text>
      </g>
    </g>

    <!-- Target Audience & Negative Keywords panel -->
    <g transform="translate(30, 230)">
      <rect width="580" height="210" rx="6" fill="#121512" stroke="#2B302B" stroke-width="1.5"/>
      <text x="24" y="36" font-family="monospace" font-size="12" font-weight="bold" fill="#F8F8F4">COMMERCIAL AUDIENCE TARGETING</text>
      <line x1="24" y1="48" x2="556" y2="48" stroke="#2B302B" stroke-width="1"/>
      
      <!-- Pills -->
      <rect x="24" y="66" width="160" height="32" rx="4" fill="#2B302B"/>
      <text x="104" y="86" font-family="sans-serif" font-size="12" fill="#F8F8F4" text-anchor="middle">✓ B2B Decision Makers</text>
      
      <rect x="194" y="66" width="160" height="32" rx="4" fill="#2B302B"/>
      <text x="274" y="86" font-family="sans-serif" font-size="12" fill="#F8F8F4" text-anchor="middle">✓ 25-mile local radius</text>

      <rect x="364" y="66" width="180" height="32" rx="4" fill="#2B302B"/>
      <text x="454" y="86" font-family="sans-serif" font-size="12" fill="#F8F8F4" text-anchor="middle">✓ Intent-driven keywords</text>

      <!-- Negative Keywords Tag (Preventing wasted spend) -->
      <rect x="24" y="118" width="532" height="66" rx="4" fill="#1E231E" stroke="#FF5B1F" stroke-width="1"/>
      <text x="40" y="142" font-family="monospace" font-size="11" font-weight="bold" fill="#FF5B1F">NEGATIVE KEYWORD PROTECTION ACTIVE</text>
      <text x="40" y="166" font-family="sans-serif" font-size="12" fill="#C9CBC4">Zero wasted budget on domestic, DIY, cheap, free, or jobs searches.</text>
    </g>
  </g>
</svg>