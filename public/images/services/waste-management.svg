<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EAEAE2"/>
  <!-- Floor line -->
  <line x1="60" y1="480" x2="740" y2="480" stroke="#121512" stroke-width="3"/>
  <line x1="60" y1="488" x2="740" y2="488" stroke="#D5D5CB" stroke-width="1.5" stroke-dasharray="8 8"/>
  
  <!-- Left Bin: General Waste (Ink Dark) -->
  <g transform="translate(140, 200)">
    <!-- Wheels -->
    <circle cx="40" cy="280" r="22" fill="#121512"/>
    <circle cx="40" cy="280" r="8" fill="#EAEAE2"/>
    <circle cx="160" cy="280" r="22" fill="#121512"/>
    <circle cx="160" cy="280" r="8" fill="#EAEAE2"/>
    <!-- Body -->
    <path d="M 20 60 L 35 270 L 165 270 L 180 60 Z" fill="#1E231E" stroke="#121512" stroke-width="3"/>
    <!-- Lid -->
    <path d="M 10 50 L 190 50 L 180 30 L 20 30 Z" fill="#121512"/>
    <rect x="70" y="20" width="60" height="10" rx="3" fill="#FF5B1F"/>
    <!-- Front Label -->
    <rect x="45" y="110" width="110" height="90" fill="#F8F8F4" rx="4" stroke="#121512" stroke-width="2"/>
    <text x="100" y="135" font-family="monospace" font-size="11" font-weight="bold" fill="#121512" text-anchor="middle" letter-spacing="1">GENERAL WASTE</text>
    <line x1="55" y1="145" x2="145" y2="145" stroke="#121512" stroke-width="1"/>
    <text x="100" y="165" font-family="monospace" font-size="16" font-weight="900" fill="#FF5B1F" text-anchor="middle">1100L</text>
    <text x="100" y="185" font-family="monospace" font-size="9" fill="#5B605A" text-anchor="middle">DUTY OF CARE WTN</text>
  </g>

  <!-- Middle Bin: Dry Mixed Recycling (Signal Orange Lid) -->
  <g transform="translate(360, 160)">
    <!-- Wheels -->
    <circle cx="50" cy="320" r="24" fill="#121512"/>
    <circle cx="50" cy="320" r="9" fill="#EAEAE2"/>
    <circle cx="190" cy="320" r="24" fill="#121512"/>
    <circle cx="190" cy="320" r="9" fill="#EAEAE2"/>
    <!-- Body -->
    <path d="M 25 70 L 45 310 L 195 310 L 215 70 Z" fill="#2B302B" stroke="#121512" stroke-width="3"/>
    <!-- Orange Lid -->
    <path d="M 10 60 L 230 60 L 220 35 L 20 35 Z" fill="#FF5B1F" stroke="#121512" stroke-width="2"/>
    <rect x="85" y="22" width="70" height="12" rx="3" fill="#121512"/>
    <!-- Front Label -->
    <rect x="60" y="130" width="120" height="110" fill="#F8F8F4" rx="4" stroke="#121512" stroke-width="2"/>
    <text x="120" y="160" font-family="monospace" font-size="12" font-weight="bold" fill="#121512" text-anchor="middle" letter-spacing="1">DRY MIXED</text>
    <text x="120" y="176" font-family="monospace" font-size="12" font-weight="bold" fill="#121512" text-anchor="middle" letter-spacing="1">RECYCLING</text>
    <line x1="75" y1="188" x2="165" y2="188" stroke="#FF5B1F" stroke-width="2"/>
    <text x="120" y="210" font-family="monospace" font-size="18" font-weight="900" fill="#121512" text-anchor="middle">ZERO LANDFILL</text>
    <text x="120" y="226" font-family="monospace" font-size="9" fill="#5B605A" text-anchor="middle">SIMPLER RECYCLING</text>
  </g>

  <!-- Technical Spec Tag -->
  <g transform="translate(60, 60)">
    <rect width="210" height="42" fill="#121512" rx="3"/>
    <circle cx="20" cy="21" r="5" fill="#FF5B1F"/>
    <text x="36" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#F8F8F4" letter-spacing="1.5">SPEC // COMMERCIAL WASTE</text>
  </g>
</svg>